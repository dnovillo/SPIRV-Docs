name: Spec build

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
    branches:
      - main

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build_main:
    if: ${{ github.event_name != 'push'}}
    runs-on: ubuntu-latest
    # We now refer to the container by its SHA instead of the name, to prevent
    # caching problems when updating the image.
    # container: khronosgroup/docker-images:asciidoctor-spec.20240726
    container: khronosgroup/docker-images@sha256:089687083ceb36483a3917389e4278718ab19c594099634f5dd80e22540c960f
    steps:
      - name: Checkout
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          ref: main
          submodules: true
      - name: Build Specs
        run: |
          make html
          mkdir -p latest
          find specs -name "*.html" -exec cp {} latest  \;
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: previous_rev
          path: latest

  build_pr:
    runs-on: ubuntu-latest
    needs: build_main
    # We now refer to the container by its SHA instead of the name, to prevent
    # caching problems when updating the image.
    # container: khronosgroup/docker-images:asciidoctor-spec.20240726
    container: khronosgroup/docker-images@sha256:089687083ceb36483a3917389e4278718ab19c594099634f5dd80e22540c960f
    steps:
      - name: Checkout
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          submodules: true
      - name: Get reference build
        if: ${{ github.event_name != 'push'}}
        uses: actions/download-artifact@v4
        with:
          name: previous_rev
      - name: create artifact folder
        run: |
          mkdir artifact
      - name: Install link checker and diff dependencies
        run: |
          apt-get update && apt-get install -y tidy
          python3 -m pip install requests beautifulsoup4 utidylib
          python3 -c "import tidy"
      - name: Build HTML Specs
        run: |
          make html
          make check
          cp specs/*.html artifact
      - name: Build PDF Specs
        if: ${{ github.event_name == 'push'}}
        run: |
          make pdf
          cp specs/*.pdf artifact
      - name: Build diff
        if: ${{ github.event_name != 'push'}}
        run: |
          make diff-dev
      - name: Save dev artifact
        if: ${{ github.event_name != 'push'}}
        uses: actions/upload-artifact@v4
        with:
          name: diffs
          path: diff
      - name: Save release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: artifact
